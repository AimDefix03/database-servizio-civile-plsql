name: CI

on:
  push:
  pull_request:

jobs:
  lint-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa SQLFluff
        run: pip install sqlfluff==4.4.0
      - name: Lint degli script SQL
        run: sqlfluff lint .

  test-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avvia Oracle Free
        run: docker compose up -d --wait
      - name: Installa il database ed esegui i test
        run: scripts/run-tests.sh
